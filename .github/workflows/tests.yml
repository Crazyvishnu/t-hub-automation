name: Tests
on:
  push:
    branches-ignore: [radar-state]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
  sources:
    if: github.event.repository.private == false && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Verify live sources without sending messages
        run: python -m radar --mode dry-run
